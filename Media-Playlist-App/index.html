        function clearImageTimer() {
            if (imageTimer !== null) {
                clearTimeout(imageTimer);
                imageTimer = null;
            }
        }

        function startImageTimer() {
            clearImageTimer();
            isPaused = false;
            playPauseIcon.innerHTML = ICON_PAUSE;
            imageTimer = setTimeout(() => {
                isSwitchingMedia = true;
                nextItem(false);
            }, IMAGE_DURATION);
        }

        function togglePlayPause() {
            if (playlist.length === 0) return;
            const currentItem = playlist[currentIndex];
            if (!currentItem) return;

            if (currentItem.type === "image") {
                if (isPaused) {
                    startImageTimer();
                } else {
                    isPaused = true;
                    clearImageTimer();
                    playPauseIcon.innerHTML = ICON_PLAY;
                }
            } else if (currentItem.type === "video") {
                if (video.paused) {
                    video.play().then(() => {
                        isPaused = false;
                        playPauseIcon.innerHTML = ICON_PAUSE;
                        resetControlsTimer();
                    }).catch(() => {});
                } else {
                    video.pause();
                    isPaused = true;
                    playPauseIcon.innerHTML = ICON_PLAY;
                    showControls();
                }
            }
        }

        /* =========================================================
           AUDIO, VOLUME BOOST (0% - 300% VLC STYLE) & OPTIONS POPUP
           ========================================================= */
        function getSavedVolume() {
            const saved = localStorage.getItem(VOLUME_STORAGE_KEY);
            if (saved !== null) {
                const num = Number(saved);
                if (Number.isFinite(num) && num >= 0 && num <= 3) {
                    return num;
                }
            }
            return 1.0;
        }

        function getSavedMuted() {
            return localStorage.getItem(MUTED_STORAGE_KEY) === "true";
        }

        function saveAudioPreferences() {
            try {
                localStorage.setItem(VOLUME_STORAGE_KEY, String(currentVolumeLevel));
                localStorage.setItem(MUTED_STORAGE_KEY, String(isAudioMuted));
            } catch (e) {}
        }

        function initWebAudio() {
            if (audioCtx) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                audioCtx = new AudioContextClass();
                audioSourceNode = audioCtx.createMediaElementSource(video);
                audioGainNode = audioCtx.createGain();
                audioGainNode.gain.setValueAtTime(isAudioMuted ? 0 : currentVolumeLevel, audioCtx.currentTime);

                // Peak limiter / compressor tuned for transparent, high-output boost up to 300%
                // Avoid low threshold that squashes gain; allow clean linear amplification across all quiet/normal ranges
                audioCompressorNode = audioCtx.createDynamicsCompressor();
                audioCompressorNode.threshold.setValueAtTime(-0.3, audioCtx.currentTime);
                audioCompressorNode.knee.setValueAtTime(10, audioCtx.currentTime);
                audioCompressorNode.ratio.setValueAtTime(12, audioCtx.currentTime);
                audioCompressorNode.attack.setValueAtTime(0.002, audioCtx.currentTime);
                audioCompressorNode.release.setValueAtTime(0.15, audioCtx.currentTime);

                audioSourceNode.connect(audioGainNode);
                audioGainNode.connect(audioCompressorNode);
                audioCompressorNode.connect(audioCtx.destination);
                video.volume = 1.0;
            } catch (e) {
                console.warn("Web Audio API not supported or initialization failed:", e);
            }
        }

        function ensureAudioContext() {
            initWebAudio();
            if (audioCtx) {
                if (audioCtx.state === "suspended") {
                    audioCtx.resume().catch(() => {});
                }
                if (audioGainNode) {
                    audioGainNode.gain.setValueAtTime(isAudioMuted ? 0 : currentVolumeLevel, audioCtx.currentTime);
                    video.volume = 1.0;
                }
            }
        }

        function updateMuteButtonUI() {
            if (!muteButton || !muteIcon) return;
            const isCurrentlyMuted = isAudioMuted || video.muted || currentVolumeLevel === 0;
            if (isCurrentlyMuted) {
                muteIcon.innerHTML = ICON_VOLUME_MUTED;
                muteButton.title = "Unmute (m)";
                muteButton.classList.add("muted");
            } else {
                muteIcon.innerHTML = ICON_VOLUME_HIGH;
                const pct = Math.round(currentVolumeLevel * 100);
                muteButton.title = pct > 100 ? `Mute (m) - Volume ${pct}% (Boost)` : `Mute (m) - Volume ${pct}%`;
                muteButton.classList.remove("muted");
            }
        }

        function updateVolumeUI() {
            if (!volumeSlider || !volumeBadge) return;
            const pct = Math.round(currentVolumeLevel * 100);
            volumeSlider.value = pct;

            const isCurrentlyMuted = isAudioMuted || video.muted || pct === 0;
            if (isCurrentlyMuted) {
                volumeBadge.textContent = "Muted";
                volumeBadge.className = "volume-badge muted";
            } else if (pct > 100) {
                volumeBadge.textContent = `${pct}% BOOST`;
                volumeBadge.className = "volume-badge boosted";
            } else {
                volumeBadge.textContent = `${pct}%`;
                volumeBadge.className = "volume-badge";
            }

            // Update slider background gradient track (0% - 300% range, 100% standard notch at 33.333%)
            const percentOfTrack = (pct / 300) * 100;
            if (isCurrentlyMuted) {
                volumeSlider.style.background = `rgba(255, 255, 255, 0.15)`;
            } else if (pct <= 100) {
                volumeSlider.style.background = `linear-gradient(to right, #38bdf8 0%, #38bdf8 ${percentOfTrack}%, rgba(255, 255, 255, 0.15) ${percentOfTrack}%, rgba(255, 255, 255, 0.15) 100%)`;
            } else {
                volumeSlider.style.background = `linear-gradient(to right, #38bdf8 0%, #38bdf8 33.333%, #f97316 33.333%, #f97316 ${percentOfTrack}%, rgba(255, 255, 255, 0.15) ${percentOfTrack}%, rgba(255, 255, 255, 0.15) 100%)`;
            }

            // Update preset buttons active state
            const presetButtons = document.querySelectorAll(".vol-preset-btn");
            presetButtons.forEach(btn => {
                if (!isCurrentlyMuted && Number(btn.dataset.vol) === pct) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
        }

        function applyVolumeAndMute() {
            video.muted = isAudioMuted;
            if (audioGainNode) {
                audioGainNode.gain.setValueAtTime(isAudioMuted ? 0 : currentVolumeLevel, audioCtx ? audioCtx.currentTime : 0);
                video.volume = 1.0;
            } else {
                video.volume = Math.min(1.0, currentVolumeLevel);
            }
            updateMuteButtonUI();
            updateVolumeUI();
        }

        function setVolume(level) {
            const numericLevel = Math.max(0, Math.min(300, Math.round(Number(level))));
            currentVolumeLevel = numericLevel / 100;

            if (numericLevel === 0) {
                muteAudio();
            } else {
                if (isAudioMuted || video.muted) {
                    isAudioMuted = false;
                    video.muted = false;
                    hideOverlay();
                }
                ensureAudioContext();
                if (audioGainNode) {
                    audioGainNode.gain.value = currentVolumeLevel;
                    video.volume = 1.0;
                } else {
                    video.volume = Math.min(1.0, currentVolumeLevel);
                }
                updateMuteButtonUI();
                updateVolumeUI();
                saveAudioPreferences();
            }
        }

        function unmuteAudio() {
            isAudioMuted = false;
            video.muted = false;
            if (currentVolumeLevel === 0) {
                currentVolumeLevel = 1.0;
            }
            ensureAudioContext();
            if (audioGainNode) {
                audioGainNode.gain.value = currentVolumeLevel;
                video.volume = 1.0;
            } else {
                video.volume = Math.min(1.0, currentVolumeLevel);
            }
            hideOverlay();
            updateMuteButtonUI();
            updateVolumeUI();
            saveAudioPreferences();
        }

        function muteAudio() {
            isAudioMuted = true;
            video.muted = true;
            if (audioGainNode) {
                audioGainNode.gain.value = 0;
            }
            updateMuteButtonUI();
            updateVolumeUI();
            saveAudioPreferences();
        }

        function toggleMute() {
            hasUserInteracted = true;
            ensureAudioContext();
            if (isAudioMuted || video.muted) {
                unmuteAudio();
            } else {
                muteAudio();
            }
            showControls();
        }

        function showVolumeFeedback(pct, isMuted) {
            if (!volumeFeedback || !volumeFeedbackIcon || !volumeFeedbackText) return;
            clearTimeout(volumeFeedbackTimer);
            if (isMuted || pct === 0) {
                volumeFeedbackIcon.innerHTML = ICON_VOLUME_MUTED;

            } else if (pct > 100) {

                volumeFeedbackText.textContent = `${pct}% BOOST`;
                volumeFeedback.classList.add("boosted");
            } else {
                volumeFeedbackIcon.innerHTML = ICON_VOLUME_HIGH;
                volumeFeedbackText.textContent = `${pct}%`;
                volumeFeedback.classList.remove("boosted");
            }
            volumeFeedback.classList.add("active");
            volumeFeedbackTimer = setTimeout(() => {
                volumeFeedback.classList.remove("active");

        function toggleOptionsMenu() {
            hasUserInteracted = true;
            showControls();
            if (isOptionsMenuOpen) {
                closeOptionsMenu();
            } else {
                openOptionsMenu();
            }
        }

        function openOptionsMenu() {
            if (!moreOptionsMenu) return;
            isOptionsMenuOpen = true;
            moreOptionsMenu.style.display = "flex";
            requestAnimationFrame(() => {
                moreOptionsMenu.classList.add("open");
            });
            if (moreOptionsButton) moreOptionsButton.classList.add("active");
            clearTimeout(controlsTimeout);

            // Prevent horizontal overflow on screens
            requestAnimationFrame(() => {
                const rect = moreOptionsMenu.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                if (rect.right > viewportWidth - 8) {
                    const diff = rect.right - (viewportWidth - 8);
                    moreOptionsMenu.style.transform = `translateX(calc(-50% - ${diff}px)) translateY(0) scale(1)`;
                } else if (rect.left < 8) {
                    const diff = 8 - rect.left;
                    moreOptionsMenu.style.transform = `translateX(calc(-50% + ${diff}px)) translateY(0) scale(1)`;
                }
            });
        }

        function closeOptionsMenu() {
            if (!isOptionsMenuOpen || !moreOptionsMenu) return;
            isOptionsMenuOpen = false;
            moreOptionsMenu.classList.remove("open");
            if (moreOptionsButton) moreOptionsButton.classList.remove("active");
            setTimeout(() => {
                if (!isOptionsMenuOpen) {
                    moreOptionsMenu.style.display = "none";
                    moreOptionsMenu.style.transform = "";
                }
            }, 200);
            resetControlsTimer();
        }

        /* =========================================================
           OVERLAY & AUTOPLAY (Mobile Friendly)
           ========================================================= */
        function showOverlay(icon, text, action) {
            overlayIcon.textContent = icon;
            overlayText.textContent = text;
            overlayAction = action;
            playOverlay.style.display = "block";
        }

        function hideOverlay() {
            playOverlay.style.display = "none";
            overlayAction = null;
        }

        overlayBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            hasUserInteracted = true;
            ensureAudioContext();
            if (overlayAction) {
                overlayAction();
            } else {
                unmuteAudio();
                video.play();
                hideOverlay();
            }
            showControls();
        });

        function playVideoSafely() {
            video.muted = isAudioMuted;
            applyVolumeAndMute();

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        isSwitchingMedia = false;
                        hideOverlay();
                        isPaused = false;
                        playPauseIcon.innerHTML = ICON_PAUSE;
                        updateMuteButtonUI();
                        resetControlsTimer();
                    })
                    .catch(error => {
                        isSwitchingMedia = false;
                        console.log("Autoplay restricted by browser:", error);
                        if (!hasUserInteracted) {
                            video.muted = true;
                            updateMuteButtonUI();
                            updateVolumeUI();
                            video.play()
                                .then(() => {
                                    showOverlay("🔊", "Tap to Unmute", () => {
                                        hasUserInteracted = true;
                                        ensureAudioContext();
                                        unmuteAudio();
                                    });
                                })
                                .catch(() => {
                                    showOverlay("▶", "Tap to Play", () => {
                                        hasUserInteracted = true;
                                        ensureAudioContext();
                                        unmuteAudio();
                                        video.play();
                                    });
                                });
                        } else {
                            showOverlay("▶", "Tap to Play", () => {
                                hasUserInteracted = true;
                                ensureAudioContext();
                                video.play();
                                hideOverlay();
                            });
                        }
                    });
            }
        }

        /* =========================================================
           ERROR DISPLAY
           ========================================================= */
        function showError(message) {
            clearImageTimer();
            hideOverlay();
            image.style.display = "none";
            video.style.display = "none";

            const existing = document.getElementById("error-message");
            if (existing) existing.remove();

            const error = document.createElement("div");
            error.id = "error-message";
            error.innerHTML = `<p>${message}</p><button onclick="location.reload()">Retry</button>`;
            document.body.appendChild(error);
        }

        /* =========================================================
           SCRUBBER TIMELINE & LIVE SEEK PREVIEW THUMBNAIL
           - Instant 60fps preview via pre-generated 10x10 (100 frames) storyboard sprite sheet
           - Dynamic auto-detection of grid dimensions (supports 10x10, legacy 5x5, etc.)
           - Zero server resource consumption during playback (pre-generated and cached)
           ========================================================= */
        const STORYBOARD_COLS = 10;
        const STORYBOARD_ROWS = 10;
        const STORYBOARD_TOTAL_FRAMES = 100;
        const STORYBOARD_FRAME_W = 160;
        const STORYBOARD_FRAME_H = 90;

        const storyboardCache = new Map();
        let currentStoryboard = null;

        function loadSeekStoryboard(filename) {
            currentStoryboard = null;
            if (!filename) return;

            if (storyboardCache.has(filename)) {
                currentStoryboard = storyboardCache.get(filename);
                return;
            }

            const img = new Image();
            img.crossOrigin = "anonymous";
            const sbEntry = {
                filename: filename,
                image: img,
                loaded: false,
                failed: false,
                cols: STORYBOARD_COLS,
                rows: STORYBOARD_ROWS,
                totalFrames: STORYBOARD_TOTAL_FRAMES
            };
            storyboardCache.set(filename, sbEntry);

            img.onload = () => {
                sbEntry.loaded = true;
                const nw = img.naturalWidth || (STORYBOARD_COLS * STORYBOARD_FRAME_W);
                const nh = img.naturalHeight || (STORYBOARD_ROWS * STORYBOARD_FRAME_H);
                sbEntry.cols = Math.max(1, Math.round(nw / STORYBOARD_FRAME_W));
                sbEntry.rows = Math.max(1, Math.round(nh / STORYBOARD_FRAME_H));
                sbEntry.totalFrames = sbEntry.cols * sbEntry.rows;
            };
            img.onerror = () => {
                sbEntry.failed = true;
            };
            img.src = MEDIA_DIRECTORY + "thumbs/seek/" + encodeURIComponent(filename) + ".jpg";
            currentStoryboard = sbEntry;
        }

        function preloadNearbyStoryboards(centerIndex) {
            if (!playlist || playlist.length === 0) return;
            [-1, 1, 2].forEach(offset => {
                const idx = (centerIndex + offset + playlist.length) % playlist.length;
                const item = playlist[idx];
                if (item && item.type === "video" && !storyboardCache.has(item.filename)) {
                    loadSeekStoryboard(item.filename);
                }
            });
        }

        let previewVideo = null;
        let previewCanvasCtx = null;
        let isScrubbing = false;
        let isPreviewSeeking = false;
        let pendingPreviewTime = null;
        let lastPreviewSeekTimestamp = 0;
        let previewSeekTimeout = null;
        let scrubTargetTime = 0;
        let wasPlayingBeforeScrub = false;
        const PREVIEW_SEEK_THROTTLE_MS = 120;
        const previewFrameCache = new Map();

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
            const totalSec = Math.floor(seconds);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            const pad = (n) => String(n).padStart(2, "0");
            if (h > 0) {
                return `${h}:${pad(m)}:${pad(s)}`;
            }
            return `${pad(m)}:${pad(s)}`;
        }

        function initPreviewVideo() {
            if (!previewVideo) {
                previewVideo = document.getElementById("previewVideo");
                if (!previewVideo) {
                    previewVideo = document.createElement("video");
                    previewVideo.id = "previewVideo";
                    previewVideo.className = "preview-video-elem";
                    const thumbBox = document.querySelector(".preview-thumb-box");
                    if (thumbBox) {
                        thumbBox.appendChild(previewVideo);
                    } else {
                        document.body.appendChild(previewVideo);
                    }
                }
                previewVideo.muted = true;
                previewVideo.defaultMuted = true;
                previewVideo.preload = "none";
                previewVideo.crossOrigin = "anonymous";
                previewVideo.playsInline = true;
                previewVideo.setAttribute("playsinline", "");
                previewVideo.setAttribute("webkit-playsinline", "");
                previewVideo.setAttribute("muted", "");
                previewVideo.setAttribute("aria-hidden", "true");

                previewVideo.addEventListener("seeked", () => {
                    clearTimeout(previewSeekTimeout);
                    renderPreviewFrameToCanvas();
                    isPreviewSeeking = false;
                    if (pendingPreviewTime !== null) {
                        const nextTime = pendingPreviewTime;
                        pendingPreviewTime = null;
                        dispatchPreviewSeek(nextTime);
                    }
                });

                ['error', 'stalled', 'abort', 'emptied'].forEach(evt => {
                    previewVideo.addEventListener(evt, () => {
                        clearTimeout(previewSeekTimeout);
                        isPreviewSeeking = false;
                        if (pendingPreviewTime !== null) {
                            const nextTime = pendingPreviewTime;
                            pendingPreviewTime = null;
                            dispatchPreviewSeek(nextTime);
                        }
                    });
                });
            }
            if (!previewCanvasCtx && previewCanvas) {
                previewCanvasCtx = previewCanvas.getContext("2d", { willReadFrequently: true });
            }
        }

        function setPreviewVideoSource(src) {
            clearTimeout(previewSeekTimeout);
            previewFrameCache.clear();
            pendingPreviewTime = null;
            isPreviewSeeking = false;
            if (previewCanvasCtx && previewCanvas) {
                previewCanvasCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            }
            // Do not eagerly buffer preview video; storyboards provide instant previews without server network/CPU overhead
            if (previewVideo && previewVideo.src && previewVideo.src !== src) {
                previewVideo.removeAttribute("src");
                previewVideo.load();
            }
        }

        function renderPreviewFrameToCanvas() {
            if (!previewVideo || !previewCanvas) return;
            if (previewVideo.readyState < 2) return;
            if (!previewCanvasCtx) {
                previewCanvasCtx = previewCanvas.getContext("2d", { willReadFrequently: true });
            }
            if (!previewCanvasCtx) return;

            try {
                const vw = previewVideo.videoWidth || 16;
                const vh = previewVideo.videoHeight || 9;
                const aspect = vh / vw;

                let targetW = 150;
                let targetH = Math.round(targetW * aspect);

                if (aspect > 1.2) {
                    // Vertical / Portrait reels (9:16)
                    targetH = 110;
                    targetW = Math.max(60, Math.round(targetH / aspect));
                } else if (targetH > 96) {
                    targetH = 96;
                    targetW = Math.round(targetH / aspect);
                }

                if (previewCanvas.width !== targetW || previewCanvas.height !== targetH) {
                    previewCanvas.width = targetW;
                    previewCanvas.height = targetH;
                }

                previewCanvasCtx.drawImage(previewVideo, 0, 0, targetW, targetH);
                if (previewPoster) previewPoster.style.display = "none";

                // Cache frame in memory
                const currentSec = Math.round(previewVideo.currentTime);
                const imgData = previewCanvasCtx.getImageData(0, 0, targetW, targetH);
                previewFrameCache.set(currentSec, imgData);

                // Cap memory to 60 frames
                if (previewFrameCache.size > 60) {
                    const oldestKey = previewFrameCache.keys().next().value;
                    previewFrameCache.delete(oldestKey);
                }
            } catch (e) {
                console.warn("Preview render error:", e);
            }
        }

        function renderCachedFrameToCanvas(cachedImg) {
            if (!previewCanvasCtx && previewCanvas) {
                previewCanvasCtx = previewCanvas.getContext("2d", { willReadFrequently: true });
            }
            if (previewCanvasCtx && cachedImg) {
                if (previewCanvas.width !== cachedImg.width || previewCanvas.height !== cachedImg.height) {
                    previewCanvas.width = cachedImg.width;
                    previewCanvas.height = cachedImg.height;
                }
                previewCanvasCtx.putImageData(cachedImg, 0, 0);
                if (previewPoster) previewPoster.style.display = "none";
            }
        }

        function dispatchPreviewSeek(targetTime) {
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;

            // 1. FAST PATH: Pre-generated seek storyboard sprite sheet (Instant 60fps scrub)
            const sb = (currentStoryboard && currentStoryboard.filename === currentItem.filename)
                ? currentStoryboard
                : storyboardCache.get(currentItem.filename);

            if (sb && sb.loaded && sb.image && Number.isFinite(video.duration) && video.duration > 0) {
                const totalFrames = sb.totalFrames || STORYBOARD_TOTAL_FRAMES;
                const cols = sb.cols || STORYBOARD_COLS;
                const ratio = Math.max(0, Math.min(0.9999, targetTime / video.duration));
                const frameIndex = Math.min(totalFrames - 1, Math.max(0, Math.floor(ratio * totalFrames)));
                const col = frameIndex % cols;
                const row = Math.floor(frameIndex / cols);
                const sx = col * STORYBOARD_FRAME_W;
                const sy = row * STORYBOARD_FRAME_H;

                if (!previewCanvasCtx && previewCanvas) {
                    previewCanvasCtx = previewCanvas.getContext("2d", { willReadFrequently: true });
                }
                if (previewCanvasCtx && previewCanvas) {
                    if (previewCanvas.width !== STORYBOARD_FRAME_W || previewCanvas.height !== STORYBOARD_FRAME_H) {
                        previewCanvas.width = STORYBOARD_FRAME_W;
                        previewCanvas.height = STORYBOARD_FRAME_H;
                    }
                    previewCanvasCtx.drawImage(
                        sb.image,
                        sx, sy, STORYBOARD_FRAME_W, STORYBOARD_FRAME_H,
                        0, 0, STORYBOARD_FRAME_W, STORYBOARD_FRAME_H
                    );
                    if (previewPoster) previewPoster.style.display = "none";
                }
                return;
            }

            // If storyboard is still loading, display static poster rather than triggering expensive video stream
            if (sb && !sb.failed && !sb.loaded) {
                return;
            }

            // 2. FALLBACK ONLY: If storyboard is missing or failed, dynamically seek preview video
            initPreviewVideo();
            if (previewVideo && previewVideo.src !== currentItem.src) {
                previewVideo.src = currentItem.src;
                previewVideo.load();
            }

            if (!previewVideo || !Number.isFinite(targetTime)) return;
            const key = Math.round(targetTime);

            // 1. Instant cache hit: Check exact second, or closest neighbor within 2.5s for zero lag
            let bestKey = null;
            if (previewFrameCache.has(key)) {
                bestKey = key;
            } else {
                let minDiff = 2.5;
                for (const cachedSec of previewFrameCache.keys()) {
                    const diff = Math.abs(cachedSec - targetTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestKey = cachedSec;
                    }
                }
            }

            if (bestKey !== null) {
                const cachedImg = previewFrameCache.get(bestKey);
                if (cachedImg) {
                    renderCachedFrameToCanvas(cachedImg);
                    // If exact second or very close (<1s), no need to seek video
                    if (Math.abs(bestKey - targetTime) <= 1.0) return;
                }
            }

            // 2. Trailing seek: If currently seeking, queue newest target time without aborting in-flight seek
            if (isPreviewSeeking) {
                pendingPreviewTime = targetTime;
                return;
            }

            // Throttling: Ensure minimum interval between seeks to avoid overloading decoder
            const now = Date.now();
            if (now - lastPreviewSeekTimestamp < PREVIEW_SEEK_THROTTLE_MS) {
                pendingPreviewTime = targetTime;
                if (!previewSeekTimeout) {
                    previewSeekTimeout = setTimeout(() => {
                        previewSeekTimeout = null;
                        if (pendingPreviewTime !== null) {
                            const nextTime = pendingPreviewTime;
                            pendingPreviewTime = null;
                            dispatchPreviewSeek(nextTime);
                        }
                    }, PREVIEW_SEEK_THROTTLE_MS - (now - lastPreviewSeekTimestamp));
                }
                return;
            }

            isPreviewSeeking = true;
            lastPreviewSeekTimestamp = now;

            // Safety timeout: 1500ms gives mobile network buffering ample time without premature abortion
            clearTimeout(previewSeekTimeout);
            previewSeekTimeout = setTimeout(() => {
                if (isPreviewSeeking) {
                    isPreviewSeeking = false;
                    if (pendingPreviewTime !== null) {
                        const nextTime = pendingPreviewTime;
                        pendingPreviewTime = null;
                        dispatchPreviewSeek(nextTime);
                    }
                }
            }, 1500);

            const seekTarget = Math.max(0, Math.min(targetTime, (previewVideo.duration || 1000) - 0.1));
            try {
                if (typeof previewVideo.fastSeek === "function") {
                    previewVideo.fastSeek(seekTarget);
                } else {
                    previewVideo.currentTime = seekTarget;
                }
            } catch (e) {
                try {
                    previewVideo.currentTime = seekTarget;
                } catch (e2) {
                    isPreviewSeeking = false;
                }
            }
        }

        function updateScrubberTooltip(clientX) {
            if (!progressTrackWrapper || !video || !Number.isFinite(video.duration) || video.duration <= 0) return 0;
            const rect = progressTrackWrapper.getBoundingClientRect();
            const rawX = clientX - rect.left;
            const clampedX = Math.max(0, Math.min(rect.width, rawX));
            const ratio = clampedX / rect.width;
            const targetTime = ratio * video.duration;

            // Update tooltip position relative to playerProgressArea
            if (seekPreviewTooltip && playerProgressArea) {
                const areaRect = playerProgressArea.getBoundingClientRect();
                const halfTooltip = 75;
                const rawAreaX = clientX - areaRect.left;
                const tooltipX = Math.max(halfTooltip, Math.min(areaRect.width - halfTooltip, rawAreaX));
                seekPreviewTooltip.style.left = `${tooltipX}px`;
                seekPreviewTooltip.classList.add("active");
            }
            if (previewTimeBadge) {
                previewTimeBadge.textContent = formatTime(targetTime);
            }

            // Request frame
            dispatchPreviewSeek(targetTime);
            return targetTime;
        }

        function updateProgressBarDisplay() {
            if (!video || !Number.isFinite(video.duration) || video.duration <= 0) {
                if (progressFillBar) progressFillBar.style.width = "0%";
                if (progressScrubberHandle) progressScrubberHandle.style.left = "0%";
                if (timeCurrentDisplay) timeCurrentDisplay.textContent = "00:00";
                if (timeTotalDisplay) timeTotalDisplay.textContent = "00:00";
                return;
            }

            if (!isScrubbing) {
                const currentRatio = (video.currentTime / video.duration) * 100;
                if (progressFillBar) progressFillBar.style.width = `${currentRatio}%`;
                if (progressScrubberHandle) progressScrubberHandle.style.left = `${currentRatio}%`;
                if (timeCurrentDisplay) timeCurrentDisplay.textContent = formatTime(video.currentTime);
            }

            if (timeTotalDisplay) timeTotalDisplay.textContent = formatTime(video.duration);

            // Buffered bar
            if (video.buffered && video.buffered.length > 0 && progressBufferBar) {
                try {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const buffRatio = (bufferedEnd / video.duration) * 100;
                    progressBufferBar.style.width = `${Math.min(100, buffRatio)}%`;
                } catch (e) {}
            }
        }

        function handleScrubberStart(e) {
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;
            if (!Number.isFinite(video.duration) || video.duration <= 0) return;

            if (e && e.cancelable) e.preventDefault();
            isScrubbing = true;
            hasUserInteracted = true;
            clearTimeout(previewSeekTimeout);
            isPreviewSeeking = false;

            // Pause main video so it releases decoder & bandwidth for preview
            if (!video.paused) {
                wasPlayingBeforeScrub = true;
                video.pause();
            } else {
                wasPlayingBeforeScrub = false;
            }

            if (progressTrackWrapper) progressTrackWrapper.classList.add("scrubbing");

            const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            scrubTargetTime = updateScrubberTooltip(clientX);

            const ratio = (scrubTargetTime / video.duration) * 100;
            if (progressFillBar) progressFillBar.style.width = `${ratio}%`;
            if (progressScrubberHandle) progressScrubberHandle.style.left = `${ratio}%`;
            if (timeCurrentDisplay) timeCurrentDisplay.textContent = formatTime(scrubTargetTime);

            showControls();
        }

        function handleScrubberMove(e) {
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;
            if (!Number.isFinite(video.duration) || video.duration <= 0) return;

            if (isScrubbing && e && e.cancelable) e.preventDefault();

            const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            const targetTime = updateScrubberTooltip(clientX);

            if (isScrubbing) {
                scrubTargetTime = targetTime;
                const ratio = (scrubTargetTime / video.duration) * 100;
                if (progressFillBar) progressFillBar.style.width = `${ratio}%`;
                if (progressScrubberHandle) progressScrubberHandle.style.left = `${ratio}%`;
                if (timeCurrentDisplay) timeCurrentDisplay.textContent = formatTime(scrubTargetTime);
            }
        }

        function handleScrubberEnd(e) {
            if (!isScrubbing) return;
            if (e && e.cancelable) e.preventDefault();
            isScrubbing = false;
            clearTimeout(previewSeekTimeout);
            previewSeekTimeout = null;
            isPreviewSeeking = false;
            pendingPreviewTime = null;
            if (progressTrackWrapper) progressTrackWrapper.classList.remove("scrubbing");
            if (seekPreviewTooltip) seekPreviewTooltip.classList.remove("active");

            if (Number.isFinite(scrubTargetTime)) {
                video.currentTime = scrubTargetTime;
                saveVideoPosition();
                updateProgressBarDisplay();
            }

            if (wasPlayingBeforeScrub) {
                wasPlayingBeforeScrub = false;
                video.play().catch(() => {});
            }

            resetControlsTimer();
        }

        /* =========================================================
           LOAD ITEM
           ========================================================= */
        function loadItem(index, revealControls = false) {
            isSwitchingMedia = true;
            saveVideoPosition();
            clearImageTimer();
            hideOverlay();

            if (playlist.length === 0) {
                isSwitchingMedia = false;
                return;
            }

            if (revealControls) {
                showControls();
            }

            if (index >= playlist.length) index = 0;
            if (index < 0) index = playlist.length - 1;

            currentIndex = index;
            const item = playlist[currentIndex];
            saveLastFile(item.filename);
            lastSavedVideoTime = -1;
            updateModeDisplay();

            if (galleryGrid) {
                const prevSelected = galleryGrid.querySelector(".gallery-card.selected");
                if (prevSelected) prevSelected.classList.remove("selected");
                const safeName = (window.CSS && CSS.escape) ? CSS.escape(item.filename) : item.filename;
                const newSelected = galleryGrid.querySelector(`.gallery-card[data-filename="${safeName}"]`);
                if (newSelected) newSelected.classList.add("selected");
            }

            console.log("Playing:", item.filename);

            /* IMAGE */
            if (item.type === "image") {
                if (playerProgressArea) playerProgressArea.style.display = "none";
                if (videoBufferingSpinner) videoBufferingSpinner.style.display = "none";
                video.pause();
                video.removeAttribute("src");
                video.removeAttribute("poster");
                video.load();
                video.style.display = "none";

                image.style.display = "block";
                image.src = item.src;
                isSwitchingMedia = false;
                startImageTimer();
                return;
            }

            /* VIDEO */
            if (playerProgressArea) playerProgressArea.style.display = "flex";
            loadSeekStoryboard(item.filename);
            preloadNearbyStoryboards(currentIndex);
            setPreviewVideoSource(item.src);
            updateProgressBarDisplay();

            // Prime instant preview poster from static thumbnail or memory cache
            const videoThumbUrl = MEDIA_DIRECTORY + "thumbs/" + encodeURIComponent(item.filename) + ".jpg";
            if (previewPoster) {
                let posterUrl = null;
                if (memoryThumbnailCache.has(item.filename)) {
                    posterUrl = memoryThumbnailCache.get(item.filename);
                } else if (hasServerThumbsDirectory) {
                    posterUrl = videoThumbUrl;
                }
                if (posterUrl) {
                    previewPoster.src = posterUrl;
                    previewPoster.style.display = "block";
                } else {
                    previewPoster.removeAttribute("src");
                    previewPoster.style.display = "none";
                }
            }

            image.style.display = "none";
            image.removeAttribute("src");
            video.style.display = "block";
            video.pause();

            // Set video poster immediately so thumbnail displays instead of blank black screen while buffering
            video.poster = videoThumbUrl;
            if (videoBufferingSpinner) videoBufferingSpinner.style.display = "flex";

            video.src = item.src;

            video.onloadedmetadata = () => {
                const savedTime = getSavedVideoPosition(item.filename);
                updateProgressBarDisplay();
                applyPlaybackSpeed();
                applyVolumeAndMute();

                const startPlayback = () => {
                    playVideoSafely();
                };

                if (savedTime > 0 && Number.isFinite(video.duration) && savedTime < video.duration - 0.5) {
                    video.currentTime = savedTime;
                    const onSeekedReady = () => {
                        video.removeEventListener("seeked", onSeekedReady);
                        if (video.readyState >= 3) {
                            startPlayback();
                        } else {
                            video.addEventListener("canplay", startPlayback, { once: true });
                        }
                    };
                    video.addEventListener("seeked", onSeekedReady, { once: true });
                } else {
                    video.currentTime = 0;
                    if (video.readyState >= 3) {
                        startPlayback();
                    } else {
                        video.addEventListener("canplay", startPlayback, { once: true });
                    }
                }
            };

            video.load();
        }

        /* =========================================================
           NAVIGATION
           ========================================================= */
        function nextItem(revealControls = false) {
            hasUserInteracted = true;
            saveVideoPosition();
            if (revealControls) {
                showControls();
            }
            if (playbackMode === "random") {
                loadItem(currentIndex + 1, revealControls);
                return;
            }
            loadItem(currentIndex + playbackDirection, revealControls);
        }

        function previousItem(revealControls = false) {
            hasUserInteracted = true;
            saveVideoPosition();
            if (revealControls) {
                showControls();
            }
            if (playbackMode === "random") {
                loadItem(currentIndex - 1, revealControls);
                return;
            }
            loadItem(currentIndex - playbackDirection, revealControls);
        }

        function startFromBeginning() {
            hasUserInteracted = true;
            playbackMode = "normal";
            playbackDirection = 1;
            playlist = normalPlaylist;
            savePlaybackMode();
            showControls();
            currentIndex = 0;
            loadItem(currentIndex);
        }

        function startFromLast() {
            hasUserInteracted = true;
            playbackMode = "normal";
            playbackDirection = -1;
            playlist = normalPlaylist;
            savePlaybackMode();
            showControls();
            currentIndex = playlist.length - 1;
            loadItem(currentIndex);
        }

        function toggleRandomMode() {
            hasUserInteracted = true;
            if (playbackMode === "random") {
                // Switch back to normal
                playbackMode = "normal";
                playlist = normalPlaylist;
                savePlaybackMode();
                updateModeDisplay();
                showControls();
                return;
            }

            if (randomVideoPlaylist.length === 0) {
                const restored = restoreRandomPlaylist();
                if (!restored) {
                    randomVideoPlaylist = createRandomVideoPlaylist();
                    saveRandomPlaylist();
                }
            }

            if (randomVideoPlaylist.length === 0) {
                showError("No video files were found.");
                return;

            playlist = randomVideoPlaylist;

            showControls();

        /* =========================================================
           VIDEO EVENT LISTENERS
           ========================================================= */
        setInterval(() => {
            if (playlist.length === 0) return;
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video" || video.paused) return;
            saveVideoPosition();
        }, 500);

        function isVideoFinishing() {
            if (!video || !Number.isFinite(video.duration) || video.duration <= 0) return false;
            return video.ended || (video.duration - video.currentTime <= 0.8);
        }

        const videoBufferingSpinner = document.getElementById("videoBufferingSpinner");

        video.addEventListener("waiting", () => {
            if (videoBufferingSpinner && !video.paused) {

        video.addEventListener("canplay", () => {

        video.addEventListener("play", () => {
            isPaused = false;
            playPauseIcon.innerHTML = ICON_PAUSE;

        video.addEventListener("playing", () => {
            if (videoBufferingSpinner) {

        video.addEventListener("error", () => {

        video.addEventListener("pause", () => {

        /* =========================================================
           MEDIA CONTAINER GESTURES & INTERACTIONS
           - Single click / tap anywhere: Play / Pause
           - Double tap / click:
               * Right side: Fast Forward 10s
               * Left side: Backward 5s
           - Press & hold (Long Press): 2X Speed
           - Swipe Left / Right: Next / Previous
           ========================================================= */
        const gestureIndicator = document.getElementById("gestureIndicator");
        const gestureIcon = document.getElementById("gestureIcon");
        const seekFeedbackLeft = document.getElementById("seekFeedbackLeft");
        const seekFeedbackRight = document.getElementById("seekFeedbackRight");
        const speed2xIndicator = document.getElementById("speed2xIndicator");

        let singleTapTimer = null;
        let lastTapTime = 0;
        let lastTapX = 0;
        let lastTapY = 0;

        let longPressTimer = null;
        isLongPressActive = false;
        let preLongPressSpeed = 1;
        let isPointerDown = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerStartTime = 0;
        let hasMovedSignificantly = false;
        isTouchActive = false;
        let lastTouchEndTime = 0;

        let gestureTimer = null;
        let seekTimer = null;

        function showPlayPauseFeedback(isPausedState) {
            clearTimeout(gestureTimer);
            if (isPausedState) {
                gestureIcon.innerHTML = ICON_PAUSE;
            } else {
                gestureIcon.innerHTML = ICON_PLAY;
            }
            gestureIndicator.classList.add("active");
            gestureTimer = setTimeout(() => {
                gestureIndicator.classList.remove("active");
            }, 350);
        }

        function showSeekFeedback(direction, sec) {
            clearTimeout(seekTimer);
            const overlay = direction === "right" ? seekFeedbackRight : seekFeedbackLeft;
            const otherOverlay = direction === "right" ? seekFeedbackLeft : seekFeedbackRight;
            if (otherOverlay) otherOverlay.classList.remove("active");
            if (!overlay) return;

            const textSpan = overlay.querySelector(".seek-seconds");
            if (textSpan) {
                textSpan.textContent = `${sec}s`;
            }

            overlay.classList.add("active");
            if (navigator.vibrate) {
                try { navigator.vibrate(25); } catch (e) {}
            }
            seekTimer = setTimeout(() => {
                overlay.classList.remove("active");
            }, 550);
        }

        function start2xSpeed() {
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;

            isLongPressActive = true;
            preLongPressSpeed = video.playbackRate;
            video.playbackRate = 2.0;

            if (video.paused) {
                video.play().then(() => {
                    isPaused = false;
                    playPauseIcon.innerHTML = ICON_PAUSE;
                }).catch(() => {});
            }

            speed2xIndicator.classList.add("active");
            if (navigator.vibrate) {
                try { navigator.vibrate(35); } catch (e) {}
            }
        }

        function stop2xSpeed() {
            if (!isLongPressActive) return;
            isLongPressActive = false;
            speed2xIndicator.classList.remove("active");
            video.playbackRate = playbackSpeedValue;
        }

        function handleSingleTap(isFromTouch = false) {
            hasUserInteracted = true;
            togglePlayPause();
            const currentItem = playlist[currentIndex];
            if (currentItem) {
                const isNowPaused = currentItem.type === "video" ? video.paused : isPaused;
                showPlayPauseFeedback(isNowPaused);
            }
            showControls();
        }

        let lastDoubleTapTime = 0;

        function handleDoubleTap(clientX) {
            hasUserInteracted = true;
            lastDoubleTapTime = Date.now();
            clearTimeout(singleTapTimer);
            singleTapTimer = null;

            // Ensure controls remain hidden if they were hidden
            const wereControlsHidden = controlsWrapper.classList.contains("hidden");

            const rect = mediaContainer.getBoundingClientRect();
            const relativeX = clientX - rect.left;
            const isRightSide = relativeX > (rect.width / 2);

            const currentItem = playlist[currentIndex];
            if (currentItem && currentItem.type === "video") {
                if (isRightSide) {
                    forwardSeconds(10, false); // Do NOT show playbar
                } else {
                    backwardSeconds(10, false); // Do NOT show playbar
                }
            } else {
                // If on image, tap right goes next, left goes prev
                if (isRightSide) {
                    nextItem(false);
                } else {
                    previousItem(false);
                }
            }

            if (wereControlsHidden) {
                controlsWrapper.classList.add("hidden"); const topBar = document.getElementById("topNavBar"); if (topBar) topBar.classList.add("hidden");
                clearTimeout(controlsTimeout);
            }
        }

        function onPointerStart(clientX, clientY, isFromTouch = false) {
            isPointerDown = true;
            pointerStartX = clientX;
            pointerStartY = clientY;
            pointerStartTime = Date.now();
            hasMovedSignificantly = false;

            clearTimeout(longPressTimer);
            const currentItem = playlist[currentIndex];
            if (currentItem && currentItem.type === "video") {
                longPressTimer = setTimeout(() => {
                    if (isPointerDown && !hasMovedSignificantly) {
                        start2xSpeed();
                    }
                }, 280);
            }
        }

        function onPointerMove(clientX, clientY) {
            if (!isPointerDown) return;
            const dx = clientX - pointerStartX;
            const dy = clientY - pointerStartY;
            if (Math.hypot(dx, dy) > 15) {
                hasMovedSignificantly = true;
                clearTimeout(longPressTimer);
                if (isLongPressActive) {
                    stop2xSpeed();
                }
            }
        }

        function onPointerEnd(clientX, clientY, isFromTouch = false) {
            if (!isPointerDown) return;
            isPointerDown = false;
            clearTimeout(longPressTimer);

            // If 2x speed was active, stop 2x and consume the gesture (do not tap, do not show controls)
            if (isLongPressActive) {
                stop2xSpeed();
                return;
            }

            const dx = clientX - pointerStartX;
            const dy = clientY - pointerStartY;
            const duration = Date.now() - pointerStartTime;

            // Swipe detection (swipe > 45px under 550ms)
            if (duration < 550) {
                // Vertical Swipe (Next / Prev)
                if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) {
                    clearTimeout(singleTapTimer);
                    singleTapTimer = null;
                    if (dy < 0) nextItem(false); // Swipe Up -> Next
                    else previousItem(false);    // Swipe Down -> Prev
                    return;
                }

                // Horizontal Swipe (10s seek)
                if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
                    clearTimeout(singleTapTimer);
                    singleTapTimer = null;
                    const currentItem = playlist[currentIndex];
                    if (currentItem && currentItem.type === "video") {
                        if (dx > 0) forwardSeconds(10, false);  // Swipe Right -> +10s seek
                        else backwardSeconds(10, false);       // Swipe Left -> -10s seek
                    } else {
                        if (dx > 0) nextItem(false);
                        else previousItem(false);
                    }
                    return;
                }
            }

            // Dragged / moved too much to be considered a clean tap
            if (hasMovedSignificantly) return;

            // Tap handling: Check for double tap
            const now = Date.now();
            const tapDist = Math.hypot(clientX - lastTapX, clientY - lastTapY);
            const timeSinceLastTap = now - lastTapTime;
            const timeSinceLastDoubleTap = now - lastDoubleTapTime;

            // Multi-tap seek chain (e.g. 3rd or 4th tap to seek +20s, +30s)
            if (timeSinceLastDoubleTap < 650 && tapDist < 70) {
                clearTimeout(singleTapTimer);
                singleTapTimer = null;
                lastDoubleTapTime = now;
                lastTapTime = 0;
                handleDoubleTap(clientX);
                return;
            }

            if (timeSinceLastTap < 300 && tapDist < 60) {
                // Double tap confirmed! Cancel pending single tap
                clearTimeout(singleTapTimer);
                singleTapTimer = null;
                lastTapTime = 0;
                handleDoubleTap(clientX);
            } else {
                // First tap: delay full 300ms to wait for possible second tap
                lastTapTime = now;
                lastTapX = clientX;
                lastTapY = clientY;

                clearTimeout(singleTapTimer);
                singleTapTimer = setTimeout(() => {
                    singleTapTimer = null;
                    handleSingleTap(isFromTouch);
                }, 300);
            }
        }

        // TOUCH EVENTS (Mobile & Tablet)
        mediaContainer.addEventListener("touchstart", (e) => {
            if (e.target === overlayBtn || overlayBtn.contains(e.target)) return;
            isTouchActive = true;
            const touch = e.changedTouches[0];
            onPointerStart(touch.clientX, touch.clientY, true);
        }, { passive: true });

        mediaContainer.addEventListener("touchmove", (e) => {
            const touch = e.changedTouches[0];
            onPointerMove(touch.clientX, touch.clientY);
        }, { passive: true });

        mediaContainer.addEventListener("touchend", (e) => {
            isTouchActive = false;
            lastTouchEndTime = Date.now();
            const touch = e.changedTouches[0];
            onPointerEnd(touch.clientX, touch.clientY, true);
        }, { passive: true });

        mediaContainer.addEventListener("touchcancel", () => {
            isTouchActive = false;
            lastTouchEndTime = Date.now();
            isPointerDown = false;
            clearTimeout(longPressTimer);
            if (isLongPressActive) stop2xSpeed();
        }, { passive: true });

        // MOUSE EVENTS (Desktop / Laptop)
        mediaContainer.addEventListener("mousedown", (e) => {
            if (isTouchActive || Date.now() - lastTouchEndTime < 600) return;
            if (e.button !== 0) return; // Left click only
            if (e.target === overlayBtn || overlayBtn.contains(e.target)) return;
            showCursor();
            resetMouseIdleTimer();
            onPointerStart(e.clientX, e.clientY, false);
        });

        window.addEventListener("mousemove", (e) => {
            if (isTouchActive || Date.now() - lastTouchEndTime < 1000) return;
            if (isLongPressActive) return;

            if (lastKnownMouseX === null || lastKnownMouseY === null) {
                lastKnownMouseX = e.clientX;
                lastKnownMouseY = e.clientY;
                showCursor();
                resetMouseIdleTimer();
                return;
            }

            const moveDist = Math.hypot(e.clientX - lastKnownMouseX, e.clientY - lastKnownMouseY);
            // Ignore sub-pixel sensor noise and synthetic browser events under 2px
            if (moveDist < 2) return;

            lastKnownMouseX = e.clientX;
            lastKnownMouseY = e.clientY;

            showCursor();
            resetMouseIdleTimer();

            if (Date.now() - lastDoubleTapTime < 1000) return; // Suppress playbar during/after double-click
            if (moveDist >= 4) {
                showControls();
            }

            if (isPointerDown) {
                onPointerMove(e.clientX, e.clientY);
            }
        });

        window.addEventListener("mouseup", (e) => {
            if (isTouchActive || Date.now() - lastTouchEndTime < 600) return;
            showCursor();
            resetMouseIdleTimer();
            if (isPointerDown) {
                onPointerEnd(e.clientX, e.clientY, false);
            }
        });

        window.addEventListener("wheel", () => {
            showCursor();
            resetMouseIdleTimer();
        }, { passive: true });

        document.addEventListener("mouseleave", () => {
            hideCursor();
        });

        document.addEventListener("mouseenter", () => {
            showCursor();
            resetMouseIdleTimer();
        });

        // PREVENT MOBILE CONTEXT MENU (Download video, Copy link, etc.) ON LONG PRESS
        const preventContextMenu = (e) => {
            e.preventDefault();
            e.stopPropagation();
            return false;
        };

        mediaContainer.addEventListener("contextmenu", preventContextMenu);
        video.addEventListener("contextmenu", preventContextMenu);
        if (image) image.addEventListener("contextmenu", preventContextMenu);
        window.addEventListener("contextmenu", (e) => {
            if (isLongPressActive || isTouchActive || mediaContainer.contains(e.target) || (controlsWrapper && controlsWrapper.contains(e.target))) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, { capture: true, passive: false });

        /* =========================================================
           FULLSCREEN MODE & MOBILE AUTO-ROTATE
           - If video is landscape, auto-rotates screen to landscape
           - Supports standard Fullscreen API & iOS WebKit
           ========================================================= */
        const ICON_ENTER_FULLSCREEN = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
        const ICON_EXIT_FULLSCREEN = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';

        function isCurrentlyFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenIcon() {
            if (!fullscreenIcon) return;
            if (isCurrentlyFullscreen()) {
                fullscreenIcon.innerHTML = ICON_EXIT_FULLSCREEN;
                if (fullscreenButton) fullscreenButton.title = "Exit Fullscreen";
            } else {
                fullscreenIcon.innerHTML = ICON_ENTER_FULLSCREEN;
                if (fullscreenButton) fullscreenButton.title = "Toggle Fullscreen";
            }
        }

        async function toggleFullscreen() {
            hasUserInteracted = true;
            showControls();

            try {
                if (!isCurrentlyFullscreen()) {
                    // Check if current video is in landscape orientation
                    const isLandscape = (video && video.videoWidth && video.videoHeight)
                        ? (video.videoWidth > video.videoHeight)
                        : false;

                    // iOS Safari (iPhone) fallback: native webkitEnterFullscreen auto-rotates landscape videos
                    if (!document.documentElement.requestFullscreen && video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                        return;
                    }

                    // Standard Fullscreen API
                    const targetElem = document.documentElement;
                    if (targetElem.requestFullscreen) {
                        await targetElem.requestFullscreen();
                    } else if (targetElem.webkitRequestFullscreen) {
                        await targetElem.webkitRequestFullscreen();
                    }

                    // Mobile auto-rotate: If the video is landscape, lock device screen to landscape!
                    if (screen.orientation && typeof screen.orientation.lock === "function") {
                        try {
                            if (isLandscape) {
                                await screen.orientation.lock("landscape");
                            } else {
                                await screen.orientation.lock("portrait");
                            }
                        } catch (err) {
                            console.log("Screen orientation lock note:", err);
                        }
                    }
                } else {
                    // Exit Fullscreen
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }

                    // Unlock orientation back to natural/auto
                    if (screen.orientation && typeof screen.orientation.unlock === "function") {
                        try {
                            screen.orientation.unlock();
                        } catch (err) {}
                    }
                }
            } catch (err) {
                console.warn("Fullscreen toggle notice:", err);
            }
        }

        document.addEventListener("fullscreenchange", () => {
            updateFullscreenIcon();
            if (!isCurrentlyFullscreen() && screen.orientation && typeof screen.orientation.unlock === "function") {
                try {
                    screen.orientation.unlock();
                } catch (e) {}
            }
        });

        document.addEventListener("webkitfullscreenchange", () => {
            updateFullscreenIcon();
            if (!isCurrentlyFullscreen() && screen.orientation && typeof screen.orientation.unlock === "function") {
                try {
                    screen.orientation.unlock();
                } catch (e) {}
            }
        });

        video.addEventListener("webkitendfullscreen", () => {
            updateFullscreenIcon();
            if (screen.orientation && typeof screen.orientation.unlock === "function") {
                try {
                    screen.orientation.unlock();
                } catch (e) {}
            }
        });

        /* =========================================================
           KEYBOARD CONTROLS (Laptop/Desktop)
           ========================================================= */
        document.addEventListener("keydown", event => {
            if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || event.target.tagName === "TEXTAREA")) {
                return;
            }
            if (event.key === "Escape") {
                if (isOptionsMenuOpen) {
                    closeOptionsMenu();
                    return;
                }
                if (isGalleryOpen) {
                    closeGalleryAndResumePlayer();
                    return;
                }
            }
            if (event.key.toLowerCase() === "g") {
                if (isGalleryOpen) {
                    closeGalleryAndResumePlayer();
                } else {
                    openGallery();
                }
                return;
            }
            if (event.key.toLowerCase() === "f") {
                event.preventDefault();
                toggleFullscreen();
                return;
            }
            if (event.key.toLowerCase() === "m") {
                event.preventDefault();
                toggleMute();
                showVolumeFeedback(Math.round(currentVolumeLevel * 100), isAudioMuted);
                return;
            }
            if (event.key === "ArrowUp") {
                event.preventDefault();
                hasUserInteracted = true;
                const newVol = Math.min(300, Math.round(currentVolumeLevel * 100) + 5);
                setVolume(newVol);
                showVolumeFeedback(newVol, false);
                showControls();
                return;
            }
            if (event.key === "ArrowDown") {
                event.preventDefault();
                hasUserInteracted = true;
                const newVol = Math.max(0, Math.round(currentVolumeLevel * 100) - 5);
                setVolume(newVol);
                showVolumeFeedback(newVol, newVol === 0);
                showControls();
                return;
            }
            if (isGalleryOpen) return;
            hasUserInteracted = true;
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                hideControls();
                previousItem(false);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                hideControls();
                nextItem(false);
            } else if (event.code === "Space" || event.key.toLowerCase() === "k") {
                event.preventDefault();
                showControls();
                togglePlayPause();
            } else if (event.key.toLowerCase() === "j") {
                showControls();
                backwardSeconds(5);
            } else if (event.key.toLowerCase() === "l") {
                showControls();
                forwardSeconds(10);
            }
        });

        /* =========================================================
           INITIALIZE APPLICATION
           ========================================================= */
        async function initialize() {
            playbackSpeedValue = getSavedPlaybackSpeed();
            applyPlaybackSpeed();

            currentVolumeLevel = getSavedVolume();
            isAudioMuted = getSavedMuted();
            applyVolumeAndMute();

            // Set up one-time user interaction listener to wake up AudioContext
            ['click', 'touchstart', 'keydown'].forEach(evt => {
                document.addEventListener(evt, () => ensureAudioContext(), { once: true, passive: true });
            });

            normalPlaylist = await discoverMediaFiles();

            if (normalPlaylist.length === 0) {
                showError("No media files were found in /files/.");
                return;
            }

            const restored = restoreRandomPlaylist();
            if (!restored) {
                randomVideoPlaylist = createRandomVideoPlaylist();
                saveRandomPlaylist();
            }

            playbackMode = getSavedPlaybackMode();
            if (playbackMode === "random") {
                playlist = randomVideoPlaylist;
                if (playlist.length === 0) {
                    playbackMode = "normal";
                    playlist = normalPlaylist;
                }
            } else {
                playlist = normalPlaylist;
            }

            const lastFile = getLastFile();
            if (lastFile) {
                const savedIndex = playlist.findIndex(item => item.filename === lastFile);
                if (savedIndex !== -1) {
                    currentIndex = savedIndex;
                } else {
                    currentIndex = (playbackMode === "random" || playbackDirection === 1) ? 0 : playlist.length - 1;
                }
            } else {
                currentIndex = (playbackMode === "random" || playbackDirection === 1) ? 0 : playlist.length - 1;
            }

            updateModeDisplay();

            console.log("Playback mode:", playbackMode);
            console.log("Playlist size:", playlist.length);
            console.log("Starting:", playlist[currentIndex].filename);

            loadItem(currentIndex);
            resetControlsTimer();
            resetMouseIdleTimer();
        }

        initialize();
    </script>
