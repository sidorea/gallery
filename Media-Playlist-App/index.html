<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Gallery Player</title>

    <style>
        :root {
            --bg-canvas: #090d16;
            --glass-bg: rgba(255, 255, 255, 0.90);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 16px 40px -4px rgba(0, 0, 0, 0.12), 0 4px 14px rgba(0, 0, 0, 0.06);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            --accent-primary: #4f46e5;
            --accent-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.38);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-canvas);
            overflow: hidden;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body.hide-cursor, body.hide-cursor * {
            cursor: none !important;
        }

        /* Media Presentation Container */
        #media-container {
            width: 100vw;
            height: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        #image, #video {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
            pointer-events: none;
        }

        #image { display: none; }
        #video { display: none; }

        /* Video Buffering Indicator */
        .video-buffering-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: opacity 0.2s ease;
        }
        .spinner-circle {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spinRing 0.8s linear infinite;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Top Monorepo Navigation Bar (Modern White Glass) */
        .top-nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(56px + var(--safe-top));
            padding-top: var(--safe-top);
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            z-index: 1200;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-nav-bar.hidden {
            opacity: 0;
        }
        .top-nav-left, .top-nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .top-logo {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }
        .top-nav-link {
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }
        .top-nav-link:hover {
            background: #ffffff;
            color: var(--accent-primary);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.18);
        }

        /* Mode & Progress Floating Pill (Embedded above controls bar) */
        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #0f172a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            pointer-events: auto;
            white-space: nowrap;
        }

        /* Center Tap Play/Pause Feedback Pulse */
        .gesture-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            z-index: 1600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .gesture-indicator.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Double-Tap Seek Ripples */
        .seek-overlay {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 38%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            z-index: 1500;
            transition: opacity 0.22s ease;
        }
        .seek-overlay.active {
            opacity: 1;
        }
        .seek-overlay.seek-left {
            left: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 100%);
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
        }
        .seek-overlay.seek-right {
            right: 0;
            background: linear-gradient(270deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 100%);
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
        }
        .seek-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .seek-content svg {
            width: 36px;
            height: 36px;
        }

        /* 2X Speed Fast Forward Pill */
        .speed-2x-pill {
            position: fixed;
            top: calc(72px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            padding: 8px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            color: var(--accent-primary);
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1600;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.25);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .speed-2x-pill.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .speed-2x-pill svg {
            width: 18px;
            height: 18px;
        }

        /* Volume HUD Feedback Pill */
        .volume-feedback-pill {
            position: fixed;
            top: calc(72px + var(--safe-top));
            right: 24px;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            color: #0f172a;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1600;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            transition: opacity 0.2s;
        }
        .volume-feedback-pill.active {
            opacity: 1;
        }
        .volume-feedback-pill.boosted {
            color: #0284c7;
            border-color: rgba(2, 132, 199, 0.4);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.2);
        }
        .volume-feedback-pill svg {
            width: 18px;
            height: 18px;
        }

        /* Tap to Play / Autoplay Overlay */
        .play-overlay {
            position: fixed;
            bottom: calc(110px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1400;
        }
        .play-overlay-btn {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
            color: #0f172a;
            cursor: pointer;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
            transition: transform 0.15s;
        }
        .play-overlay-btn:active {
            transform: scale(0.96);
        }

        /* Controls Wrapper */
        .controls-wrapper {
            position: fixed;
            bottom: max(16px, calc(16px + var(--safe-bottom)));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1200;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 96vw;
        }
        .controls-wrapper.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(16px);
            pointer-events: none;
        }

        /* Scrubber / Progress Area (Modern White Glass) */
        .player-progress-area {
            width: min(580px, 92vw);
            margin: 0 auto 8px auto;
            position: relative;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
        }
        .scrubber-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: transparent;
            padding: 4px 6px;
            border: none;
            box-shadow: none;
        }
        .time-display {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.7);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            user-select: none;
        }
        .progress-track-wrapper {
            position: relative;
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }
        .progress-track {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 9999px;
            overflow: visible;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: height 0.15s ease;
        }
        .progress-track-wrapper:hover .progress-track,
        .progress-track-wrapper.scrubbing .progress-track {
            height: 7px;
        }
        .progress-buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 9999px;
            width: 0%;
            pointer-events: none;
        }
        .progress-fill-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: linear-gradient(90deg, #6366f1, #4f46e5);
            border-radius: 9999px;
            width: 0%;
            pointer-events: none;
        }
        .progress-scrubber-handle {
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #4f46e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.15s ease;
            pointer-events: none;
        }
        .progress-track-wrapper:hover .progress-scrubber-handle,
        .progress-track-wrapper.scrubbing .progress-scrubber-handle {
            transform: translateY(-50%) scale(1);
        }

        /* Seek Preview Canvas Tooltip (No white background or outline) */
        .seek-preview-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 0;
            transform: translateX(-50%);
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 1300;
        }
        .seek-preview-tooltip.active {
            display: flex;
        }
        .preview-thumb-box {
            position: relative;
            width: 160px;
            height: 90px;
            border-radius: 10px;
            overflow: hidden;
            background: #000000;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
        }
        .preview-poster,
        .preview-canvas,
        .preview-video-elem {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .preview-poster {
            z-index: 1;
            background: #000;
        }
        .preview-canvas {
            z-index: 2;
            background: transparent;
        }
        .preview-video-elem {
            z-index: 0;
            opacity: 0.001;
            pointer-events: none;
        }
        .preview-time-badge {
            margin-top: 6px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* Floating Player Bar (Modern White Glass) */
        .player-bar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: var(--glass-shadow);
            pointer-events: auto;
            max-width: 94vw;
        }
        .player-btn {
            background: transparent;
            border: none;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
            position: relative;
            flex-shrink: 0;
        }
        .player-btn svg {
            width: 20px;
            height: 20px;
        }
        .player-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #0f172a;
            transform: scale(1.08);
        }
        .player-btn:active {
            transform: scale(0.92);
        }
        .player-btn.btn-primary {
            background: var(--accent-primary);
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .player-btn.btn-primary:hover {
            background: var(--accent-hover);
            color: #ffffff;
            transform: scale(1.08);
        }
        .player-divider {
            width: 1px;
            height: 22px;
            background: #e2e8f0;
            margin: 0 3px;
        }

        /* 3-Dots More Options Popup (Modern White Glass Card) */
        .options-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .options-popup {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            width: 310px;
            max-width: calc(100vw - 32px);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(226, 232, 240, 0.95);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 50px -6px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.05);
            z-index: 1300;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(8px) scale(0.96);
            transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.18s;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            color: #0f172a;
        }
        .options-popup.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .options-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }
        .options-label-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .options-label-group svg {
            width: 16px;
            height: 16px;
            color: #4f46e5;
        }
        .volume-badge, .speed-badge {
            background: #f1f5f9;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid #e2e8f0;
        }
        .volume-badge.boosted {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }
        .volume-slider-wrap {
            position: relative;
            margin-bottom: 6px;
        }
        .volume-slider {
            width: 100%;
            accent-color: #4f46e5;
            cursor: pointer;
        }
        .volume-mark-100 {
            position: absolute;
            left: 33.333%;
            top: 2px;
            width: 2px;
            height: 8px;
            background: #94a3b8;
            pointer-events: none;
        }
        .vol-presets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .speed-pills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .vol-preset-btn, .speed-pill-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
            padding: 7px 4px;
            border-radius: 9px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .vol-preset-btn:hover, .speed-pill-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .vol-preset-btn.active, .speed-pill-btn.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
            font-weight: 700;
        }
        .vol-preset-btn.boost.active {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }
        .options-divider {
            height: 1px;
            background: #f1f5f9;
            margin: 14px 0;
        }
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .options-row-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .options-row-left svg {
            width: 18px;
            height: 18px;
            color: #4f46e5;
        }
        .options-row-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }
        .options-row-sub {
            font-size: 11px;
            color: #64748b;
        }
        .options-toggle-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .options-toggle-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        /* Fullscreen Gallery View (Modern Minimalist Light Theme) */
        .gallery-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #f8fafc;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .gallery-header {
            height: calc(64px + var(--safe-top));
            padding-top: var(--safe-top);
            padding-left: 20px;
            padding-right: 20px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);

            background: #4f46e5;

            color: #ffffff;
        }

            color: #ffffff;
        }
        .gallery-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;

        .gallery-title {

            font-weight: 800;
            color: #0f172a;
        }
        .gallery-count-badge {
            font-size: 11px;
            font-weight: 700;
            background: #f1f5f9;
            color: #64748b;
            padding: 3px 8px;
            border-radius: 20px;

        .gallery-search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 7px 12px;
            width: 260px;
            gap: 8px;

            width: 16px;
            height: 16px;
            color: #94a3b8;
        }
        .gallery-search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 13px;
            color: #0f172a;
            background: transparent;
        }
        .search-clear-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
        }
        .gallery-filter-tabs {
            display: flex;
            gap: 6px;
        }
        .filter-tab {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .filter-tab.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        .gallery-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .gallery-info-bar {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
        }
        .cache-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #334155;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .gallery-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .gallery-card:hover {
            transform: translateY(-3px);
            border-color: #cbd5e1;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        }
        .gallery-card.selected {
            border: 2px solid #4f46e5 !important;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2), 0 8px 24px rgba(79, 70, 229, 0.15) !important;
            transform: scale(1.02);
        }
        .card-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            overflow: hidden;
        }
        .card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card-thumb.loaded {
            opacity: 1;
        }
        .card-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            pointer-events: none;
        }
        .card-skeleton.hidden {
            display: none;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }
        .card-badge.video {
            color: #4f46e5;
        }
        .card-badge.image {
            color: #7c3aed;
        }
        .card-badge svg {
            width: 12px;
            height: 12px;
        }
        .card-selected-badge {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: #4f46e5;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            z-index: 3;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .selected-pulse-dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulseDot 1.2s infinite;
        }
        @keyframes pulseDot {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }
        .card-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 2;
        }
        .gallery-card:hover .card-hover-overlay {
            opacity: 1;
        }
        .play-circle-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            transform: scale(0.85);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .gallery-card:hover .play-circle-icon {
            transform: scale(1);
        }
        .play-circle-icon svg {
            width: 20px;
            height: 20px;
            margin-left: 2px;
        }
        .card-info {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
        }
        .card-name {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .card-seq-badge {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            flex-shrink: 0;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 20px 28px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 2500;
            display: none;
            text-align: center;
        }
        .error-message.active {
            display: block;
        }
    </style>
</head>

<body>
    <!-- TOP NAVIGATION BAR & COMPANION MONOREPO APP OUTLINKS -->
    <header class="top-nav-bar" id="topNavBar">
        <div class="top-nav-left">
            <span class="top-logo">GALLERY</span>
        </div>
        <div class="top-nav-right">
            <a href="javascript:void(0)" onclick="window.open(location.protocol + '//' + location.hostname + ':9083/', '_blank')" class="top-nav-link" title="Open Media Organizer Studio (Port 9083)">
                Studio (9083) &nearr;
            </a>
            <a href="javascript:void(0)" onclick="window.open(location.protocol + '//' + location.hostname + ':80/', '_blank')" class="top-nav-link" title="Open File Upload Portal (Port 80)">
                Upload (80) &nearr;
            </a>
        </div>
    </header>

    <div id="media-container">
        <img id="image" alt="Media display" />
        <video id="video" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
        <div id="videoBufferingSpinner" class="video-buffering-spinner" style="display: none;">
            <div class="spinner-circle"></div>
        </div>
    </div>

    <!-- TAP TO PLAY / UNMUTE OVERLAY -->
    <div id="playOverlay" class="play-overlay" style="display: none;">
        <div class="play-overlay-btn" id="overlayBtn">
            <span id="overlayIcon">▶</span>
            <span id="overlayText">Tap to Play</span>
        </div>
    </div>

    <!-- PLAY / PAUSE CENTER FEEDBACK -->
    <div id="gestureIndicator" class="gesture-indicator">
        <svg id="gestureIcon" viewBox="0 0 24 24" fill="currentColor" style="width:36px;height:36px;">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>

    <!-- DOUBLE TAP SEEK FEEDBACK (LEFT: -10s, RIGHT: +10s) -->
    <div id="seekFeedbackLeft" class="seek-overlay seek-left">
        <div class="seek-content">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
            </svg>
            <span class="seek-seconds">10s</span>
        </div>
    </div>
    <div id="seekFeedbackRight" class="seek-overlay seek-right">
        <div class="seek-content">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
            </svg>
            <span class="seek-seconds">10s</span>
        </div>
    </div>

    <!-- 2X SPEED HOLD FEEDBACK -->
    <div id="speed2xIndicator" class="speed-2x-pill">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
        </svg>
        <span>2X Speed</span>
    </div>

    <!-- VOLUME FEEDBACK HUD -->
    <div id="volumeFeedback" class="volume-feedback-pill">
        <svg id="volumeFeedbackIcon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <span id="volumeFeedbackText">100%</span>
    </div>

    <!-- ERROR MESSAGE -->
    <div id="errorMessage" class="error-message"></div>

    <!-- MODERN WHITE GLASS FLOATING CONTROLS BAR -->
    <div class="controls-wrapper" id="controlsWrapper">
        <!-- PLAYBACK MODE & PROGRESS PILL (Placed unobtrusively above controls bar) -->
        <div class="player-info" id="modeDisplay">
            <span id="modeIcon">▶</span>
            <span id="modeText">Sequential</span>
            <span id="progressText" style="opacity: 0.7; font-size: 11px; margin-left: 4px;"></span>
        </div>

        <!-- SCRUBBER / PROGRESS BAR WITH LIVE SEEK PREVIEW -->
        <div class="player-progress-area" id="playerProgressArea">

            <div class="seek-preview-tooltip" id="seekPreviewTooltip">

                    <video class="preview-video-elem" id="previewVideo" muted playsinline webkit-playsinline preload="none" style="display:none;"></video>
                </div>

                        <div class="progress-buffer-bar" id="progressBufferBar"></div>
                        <div class="progress-fill-bar" id="progressFillBar"></div>
                        <div class="progress-scrubber-handle" id="progressScrubberHandle"></div>

        <div class="player-bar" id="controlsBar">

            </button>

            <!-- Forward 10s -->

                    <text x="12" y="16" font-size="8" font-family="sans-serif" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">10</text>

            <!-- Jump to Last -->
            <button class="player-btn" id="startLastButton" title="Start from Last" aria-label="Start from Last">

                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>

            <!-- 3 Dots (More Options) Container -->

                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>

                            <span class="volume-badge" id="volumeBadge">100%</span>

                            <button type="button" class="vol-preset-btn boost" data-vol="200">200%</button>

            <div class="player-divider"></div>

        /* =========================================================

        function resetControlsTimer() {

            controlsTimeout = setTimeout(() => {

                if (!isPaused && !isOptionsMenuOpen && ((currentItem && currentItem.type === "image") || (video && !video.paused))) {

        // Keep controls visible when hovering over bar or scrubber
        [controlsBar, playerProgressArea, modeDisplay].forEach((elem) => {

        /* =========================================================
           FILE HELPERS
           ========================================================= */
        function getExtension(filename) {
            const lastDot = filename.lastIndexOf(".");
            if (lastDot === -1) return "";
            return filename.substring(lastDot).toLowerCase();
        }

        function isImage(filename) {
            return IMAGE_EXTENSIONS.includes(getExtension(filename));
        }

        function isVideo(filename) {
            return VIDEO_EXTENSIONS.includes(getExtension(filename));
        }

        function isValidMediaFile(filename) {
            const lowerName = filename.toLowerCase();
            if (lowerName.startsWith(".") || lowerName.startsWith("__stage_")) return false;
            if (lowerName.endsWith(".html") || lowerName.endsWith(".htm")) return false;
            return isImage(filename) || isVideo(filename);
        }

        function getSequenceNumber(filename) {
            const match = filename.match(/insta\s+vid\s*\(\s*(\d+)\s*\)/i);
            if (!match) return Number.MAX_SAFE_INTEGER;
            return parseInt(match[1], 10);
        }

        function getExtensionOrder(filename) {
            const extension = getExtension(filename);
            const order = {
                ".jpg": 1, ".jpeg": 2, ".png": 3, ".gif": 4, ".webp": 5, ".bmp": 6, ".avif": 7,
                ".mp4": 20, ".webm": 21, ".ogg": 22, ".mov": 23, ".m4v": 24
            };
            return order[extension] || 999;
        }

        function sortPlaylist(files) {
            files.sort((a, b) => {
                const numberDiff = getSequenceNumber(a.filename) - getSequenceNumber(b.filename);
                if (numberDiff !== 0) return numberDiff;

                const extDiff = getExtensionOrder(a.filename) - getExtensionOrder(b.filename);
                if (extDiff !== 0) return extDiff;

                return a.filename.localeCompare(b.filename);
            });
            return files;
        }

        /* =========================================================
           DISCOVER MEDIA FILES (Nginx Directory Listing)
           ========================================================= */
        async function discoverMediaFiles() {
            try {
                const response = await fetch(MEDIA_DIRECTORY, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const rawText = await response.text();
                const mediaFiles = [];
                let parsedJson = false;

                try {
                    const trimmed = rawText.trim();
                    if (trimmed.startsWith("[") && trimmed.endsWith("]")) {
                        const jsonList = JSON.parse(trimmed);
                        if (Array.isArray(jsonList)) {
                            parsedJson = true;
                            jsonList.forEach(entry => {
                                const name = entry.name;
                                if (!name) return;
                                if (name === "thumbs" || name.endsWith("/thumbs")) {
                                    hasServerThumbsDirectory = true;
                                    return;
                                }
                                if (entry.type === "directory") return;
                                if (!isValidMediaFile(name)) return;

                                let type = isImage(name) ? "image" : (isVideo(name) ? "video" : null);
                                if (!type) return;

                                mediaFiles.push({
                                    filename: name,
                                    src: MEDIA_DIRECTORY + encodeURIComponent(name),
                                    type: type
                                });
                            });
                        }
                    }
                } catch (e) {
                    parsedJson = false;
                }

                if (!parsedJson) {
                    const parser = new DOMParser();
                    const directoryDocument = parser.parseFromString(rawText, "text/html");
                    const links = directoryDocument.querySelectorAll("a");

                    links.forEach(link => {
                        const href = link.getAttribute("href");
                        if (!href) return;
                        const lowerHref = href.toLowerCase();
                        if (lowerHref === "thumbs/" || lowerHref.endsWith("/thumbs/")) {
                            hasServerThumbsDirectory = true;
                            return;
                        }
                        if (href.endsWith("/")) return;

                        let filename;
                        try {
                            filename = decodeURIComponent(href.split("/").pop());
                        } catch (error) {
                            filename = href.split("/").pop();
                        }

                        if (!filename || !isValidMediaFile(filename)) return;

                        let type;
                        if (isImage(filename)) {
                            type = "image";
                        } else if (isVideo(filename)) {
                            type = "video";
                        } else {
                            return;
                        }

                        mediaFiles.push({
                            filename: filename,
                            src: MEDIA_DIRECTORY + encodeURIComponent(filename),
                            type: type
                        });
                    });
                }

                hasServerThumbsDirectory = true;
                sortPlaylist(mediaFiles);
                console.log("Total media files discovered:", mediaFiles.length);
                return mediaFiles;
            } catch (error) {
                console.error("Unable to scan media directory:", error);
                showError("Unable to read the media folder. Make sure files are available.");
                return [];
            }
        }

        /* =========================================================
           INDEXEDDB THUMBNAIL CACHE
           - Keeps CPU at 0% after the first visit!
           - Fast retrieval of cached JPEG Blobs
           ========================================================= */
        const DB_NAME = "MediaGalleryThumbnailCache";
        const DB_VERSION = 1;
        const STORE_NAME = "thumbnails";

        function openThumbnailDB() {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    return resolve(null);
                }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "filename" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(null);
            });
        }

        async function getCachedThumbnail(filename) {
            try {
                const db = await openThumbnailDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(filename);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        }

        async function saveCachedThumbnail(filename, blob) {
            try {
                const db = await openThumbnailDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readwrite");
                    const store = tx.objectStore(STORE_NAME);
                    store.put({ filename: filename, blob: blob, timestamp: Date.now() });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                return false;
            }
        }

        async function clearAllThumbnailCache() {
            try {
                memoryThumbnailCache.clear();
                const db = await openThumbnailDB();
                if (!db) return;
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).clear();
                tx.oncomplete = () => {
                    alert("Thumbnail cache cleared. Thumbnails will re-capture as you scroll.");
                    renderGallery();
                };
            } catch (e) {
                console.warn("Could not clear cache:", e);
            }
        }

        /* =========================================================
           THUMBNAIL EXTRACTION & MULTI-WORKER CONCURRENCY POOL
           - Strictly captures frames AFTER 30 seconds
           - 3 Parallel Workers decode concurrent streams (up to 4x faster)
           - Viewport-aware task scheduler prioritizes visible cards first
           - Server-side thumbnail detection loads static JPEGs in ~10ms
           - In-memory & IndexedDB caching ensures 0% CPU on reloads
           ========================================================= */
        const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window);
        const MAX_CONCURRENT_WORKERS = isMobileDevice ? 1 : 2;
        let activeWorkers = 0;
        const thumbnailQueue = [];
        const memoryThumbnailCache = new Map();
        let galleryObserver = null;

        function isCardInOrNearViewport(elem) {
            if (!elem || !elem.isConnected) return false;
            const rect = elem.getBoundingClientRect();
            const margin = 350;
            return (
                rect.bottom >= -margin &&
                rect.top <= (window.innerHeight || document.documentElement.clientHeight) + margin
            );
        }

        function calculateSeekTime(duration) {
            // "The thumbnail should be shown from the after 30sec in the video.
            // Don't include the thumbnail from first 30sec."
            if (!Number.isFinite(duration) || duration <= 0) {
                return 30.5;
            }
            if (duration > 30) {
                // Strictly > 30 seconds!
                // If video is 31s, duration - 0.2 = 30.8s (> 30s)
                // If video is 60s, seek to 30.5s (> 30s)
                return Math.min(duration - 0.2, Math.max(30.1, 30.5));
            } else {
                // If the video itself is shorter than 30s total (e.g. 10s video)
                // seeking > 30s is past the file end, so safely take 85% of duration
                return Math.max(0.1, duration * 0.85);
            }
        }

        function generateVideoThumbnail(src, filename) {
            return new Promise((resolve) => {
                const tempVideo = document.createElement("video");
                tempVideo.crossOrigin = "anonymous";
                tempVideo.preload = "metadata";
                tempVideo.muted = true;
                tempVideo.playsInline = true;

                let timeoutId = null;
                let isCompleted = false;

                const cleanup = () => {
                    if (isCompleted) return;
                    isCompleted = true;
                    clearTimeout(timeoutId);
                    tempVideo.removeAttribute("src");
                    tempVideo.load();
                };

                // Fast safety timeout: 3.5 seconds maximum per video to prevent queue stalls
                timeoutId = setTimeout(() => {
                    cleanup();
                    resolve(null);
                }, 3500);

                tempVideo.onerror = () => {
                    cleanup();
                    resolve(null);
                };

                tempVideo.onloadedmetadata = () => {
                    if (isCompleted) return;
                    const seekTime = calculateSeekTime(tempVideo.duration);
                    tempVideo.currentTime = seekTime;
                };

                tempVideo.onseeked = () => {
                    if (isCompleted) return;
                    // Snappy render tick
                    setTimeout(() => {
                        try {
                            const canvas = document.createElement("canvas");
                            // Scale down to lightweight 320px width to save 90% CPU & memory
                            const targetWidth = 320;
                            const aspect = (tempVideo.videoHeight && tempVideo.videoWidth)
                                ? (tempVideo.videoHeight / tempVideo.videoWidth)
                                : (16 / 9);
                            canvas.width = targetWidth;
                            canvas.height = Math.round(targetWidth * aspect);

                            const ctx = canvas.getContext("2d", { willReadFrequently: false, alpha: false });
                            ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob((blob) => {
                                cleanup();
                                resolve(blob);
                            }, "image/jpeg", 0.75);
                        } catch (err) {
                            console.warn("Canvas capture error:", err);
                            cleanup();
                            resolve(null);
                        }
                    }, 15);
                };

                tempVideo.src = src;
            });
        }

        function applyThumbnailToAllMatching(filename, url) {
            const currentItem = playlist[currentIndex];
            if (currentItem && currentItem.filename === filename && previewPoster && !previewPoster.src) {
                previewPoster.src = url;
                previewPoster.style.display = "block";
            }
            if (!galleryGrid) return;
            const safeName = (window.CSS && CSS.escape) ? CSS.escape(filename) : filename;
            const cards = galleryGrid.querySelectorAll(`.gallery-card[data-filename="${safeName}"]`);
            cards.forEach((c) => {
                const i = c.querySelector(".card-thumb");
                const s = c.querySelector(".card-skeleton");
                if (i) {
                    i.src = url;
                    i.onload = () => {
                        i.classList.add("loaded");
                        if (s) s.classList.add("hidden");
                        i.dataset.loaded = "true";
                    };
                }
            });
        }

        function processThumbnailQueue() {
            if (!isGalleryOpen) return;
            while (activeWorkers < MAX_CONCURRENT_WORKERS && thumbnailQueue.length > 0) {
                // Viewport-aware scheduler: find first task that is visible on screen
                let taskIndex = 0;
                for (let i = 0; i < Math.min(thumbnailQueue.length, 12); i++) {
                    const candidate = thumbnailQueue[i];
                    if (candidate.imgElem && candidate.imgElem.dataset.loaded === "true") {
                        continue;
                    }
                    if (candidate.imgElem && isCardInOrNearViewport(candidate.imgElem)) {
                        taskIndex = i;
                        break;
                    }
                }

                const [task] = thumbnailQueue.splice(taskIndex, 1);
                const { item, imgElem, skeletonElem } = task;

                if (!imgElem || imgElem.dataset.loaded === "true") {
                    continue;
                }

                activeWorkers++;

                generateVideoThumbnail(item.src, item.filename)
                    .then(async (blob) => {
                        if (blob) {
                            await saveCachedThumbnail(item.filename, blob);
                            const url = URL.createObjectURL(blob);
                            memoryThumbnailCache.set(item.filename, url);
                            applyThumbnailToAllMatching(item.filename, url);
                        } else {
                            if (skeletonElem) skeletonElem.classList.add("hidden");
                        }
                    })
                    .catch((e) => {
                        console.warn("Thumbnail note for", item.filename, e);
                        if (skeletonElem) skeletonElem.classList.add("hidden");
                    })
                    .finally(() => {
                        activeWorkers--;
                        processThumbnailQueue();
                    });
            }
        }

        function requestThumbnail(item, imgElem, skeletonElem, isHighPriority = false) {
            if (!imgElem) return;
            if (imgElem.dataset.loaded === "true" || imgElem.dataset.queued === "true") {
                return;
            }

            // 1. Direct image
            if (item.type === "image") {
                imgElem.dataset.loaded = "true";
                imgElem.src = item.src;
                imgElem.onload = () => {
                    imgElem.classList.add("loaded");
                    if (skeletonElem) skeletonElem.classList.add("hidden");
                };
                return;
            }

            // 2. Instant In-Memory Cache (0ms)
            if (memoryThumbnailCache.has(item.filename)) {
                imgElem.dataset.loaded = "true";
                imgElem.src = memoryThumbnailCache.get(item.filename);
                imgElem.classList.add("loaded");
                if (skeletonElem) skeletonElem.classList.add("hidden");
                return;
            }

            // 3. Fast Server-Side Static Thumbnail Check (if server has thumbs/ directory)
            if (hasServerThumbsDirectory && item.type === "video") {
                imgElem.dataset.queued = "true";
                const thumbUrl = MEDIA_DIRECTORY + "thumbs/" + encodeURIComponent(item.filename) + ".jpg";
                const probeImg = new Image();
                probeImg.onload = () => {
                    memoryThumbnailCache.set(item.filename, thumbUrl);
                    applyThumbnailToAllMatching(item.filename, thumbUrl);
                };
                probeImg.onerror = () => {
                    // Fall back to IndexedDB / client video extraction
                    imgElem.dataset.queued = "false";
                    queueClientThumbnail(item, imgElem, skeletonElem, isHighPriority);
                };
                probeImg.src = thumbUrl;
                return;
            }

            // 4. Client-side flow (IndexedDB + Multi-Worker pool)
            queueClientThumbnail(item, imgElem, skeletonElem, isHighPriority);
        }

        function queueClientThumbnail(item, imgElem, skeletonElem, isHighPriority = false) {
            if (imgElem.dataset.loaded === "true") return;
            imgElem.dataset.queued = "true";

            getCachedThumbnail(item.filename).then((blob) => {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    memoryThumbnailCache.set(item.filename, url);
                    applyThumbnailToAllMatching(item.filename, url);
                } else {
                    const task = { item, imgElem, skeletonElem };
                    if (isHighPriority) {
                        thumbnailQueue.unshift(task);
                    } else {
                        thumbnailQueue.push(task);
                    }
                    processThumbnailQueue();
                }
            });
        }

        /* =========================================================
           GALLERY VIEW LOGIC & AUTO-SCROLL TO SELECTED VIDEO
           ========================================================= */
        function openGallery() {
            closeOptionsMenu();
            isGalleryOpen = true;
            saveVideoPosition();
            clearImageTimer();
            if (!video.paused) {
                video.pause();
                isPaused = true;
                playPauseIcon.innerHTML = ICON_PLAY;
            }

            // Hide player & controls
            mediaContainer.style.display = "none";
            controlsWrapper.classList.add("hidden"); const topBar = document.getElementById("topNavBar"); if (topBar) topBar.classList.add("hidden");
            hideOverlay();
            showCursor();
            clearTimeout(mouseIdleTimer);
            clearTimeout(controlsTimeout);

            // Show gallery view
            galleryView.style.display = "flex";

            // Render current list of media items
            renderGallery();

            // Instantly center the currently selected video into view so only visible cards load
            requestAnimationFrame(() => {
                const selectedCard = galleryGrid.querySelector(".gallery-card.selected");
                if (selectedCard) {
                    selectedCard.scrollIntoView({ behavior: "auto", block: "center" });

        function closeGalleryAndResumePlayer(targetIndex) {
            closeOptionsMenu();
            isGalleryOpen = false;
            galleryView.style.display = "none";
            mediaContainer.style.display = "flex";
            showControls();
            resetMouseIdleTimer();

            if (typeof targetIndex === "number" && targetIndex >= 0 && targetIndex < playlist.length) {
                loadItem(targetIndex);
            } else {
                // Resume current item
                const currentItem = playlist[currentIndex];
                if (currentItem) {
                    if (currentItem.type === "video") {
                        playVideoSafely();
                    } else if (currentItem.type === "image") {
                        startImageTimer();
                    }
                }
            }
        }

        function renderGallery() {
            if (!galleryGrid) return;
            galleryGrid.innerHTML = "";

            // Disconnect old observer if any
            if (galleryObserver) {
                galleryObserver.disconnect();
            }

            galleryObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const img = card.querySelector(".card-thumb");
                        const skeleton = card.querySelector(".card-skeleton");
                        const filename = card.dataset.filename;
                        const item = normalPlaylist.find((m) => m.filename === filename);
                        if (item && img) {
                            const isSelected = card.classList.contains("selected");
                            requestThumbnail(item, img, skeleton, isSelected);
                        }
                        obs.unobserve(card);
                    }
                });
            }, { root: null, rootMargin: "120px 0px", threshold: 0.01 });

            // Apply filter & search
            const q = gallerySearchQuery.trim().toLowerCase();
            const sourceList = (playbackMode === "random" && randomVideoPlaylist.length > 0)
                ? randomVideoPlaylist
                : normalPlaylist;

            const filtered = sourceList.filter((item) => {
                if (activeGalleryFilter === "video" && item.type !== "video") return false;
                if (activeGalleryFilter === "image" && item.type !== "image") return false;
                if (q && !item.filename.toLowerCase().includes(q)) return false;
                return true;
            });

            // Update count
            if (galleryCount) {
                galleryCount.textContent = `${filtered.length} of ${sourceList.length} items`;
            }

            if (filtered.length === 0) {
                if (galleryEmptyState) galleryEmptyState.style.display = "block";
                return;
            } else {
                if (galleryEmptyState) galleryEmptyState.style.display = "none";
            }

            const currentPlayingItem = playlist[currentIndex];

            filtered.forEach((item) => {
                // Determine if this item is the currently selected video
                const isCurrent = currentPlayingItem && (currentPlayingItem.filename === item.filename);

                const card = document.createElement("div");
                card.className = `gallery-card ${isCurrent ? "selected" : ""}`;
                card.dataset.filename = item.filename;

                const realIndex = playlist.findIndex((p) => p.filename === item.filename);
                card.dataset.playlistIndex = realIndex !== -1 ? realIndex : 0;

                const isVideoItem = item.type === "video";
                const seqNumber = getSequenceNumber(item.filename);

                card.innerHTML = `
                    <div class="card-thumb-wrapper">
                        <img class="card-thumb" alt="${item.filename}" />
                        <div class="card-skeleton"></div>
                        <div class="card-badge ${item.type}">
                            ${isVideoItem
                                ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> VIDEO'
                                : '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg> IMG'}
                        </div>
                        ${isCurrent ? `
                            <div class="card-selected-badge">
                                <span class="selected-pulse-dot"></span>
                                <span>NOW PLAYING</span>
                            </div>` : ''}
                        <div class="card-hover-overlay">
                            <div class="play-circle-icon">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-info">
                        <span class="card-name" title="${item.filename}">${item.filename}</span>
                        <span class="card-seq-badge">${seqNumber !== Number.MAX_SAFE_INTEGER ? '#' + seqNumber : ''}</span>
                    </div>
                `;

                card.addEventListener("click", () => {
                    const targetIdx = parseInt(card.dataset.playlistIndex, 10);
                    closeGalleryAndResumePlayer(targetIdx);
                });

                galleryGrid.appendChild(card);
                galleryObserver.observe(card);

                // Priority boost: immediately request thumbnail for currently selected item
                if (isCurrent) {
                    const thumbImg = card.querySelector(".card-thumb");
                    const thumbSkel = card.querySelector(".card-skeleton");
                    if (thumbImg) {
                        requestThumbnail(item, thumbImg, thumbSkel, true);
                    }
                }
            });
        }

        /* =========================================================
           RANDOM PLAYLIST LOGIC
           ========================================================= */
        function createRandomVideoPlaylist() {
            const videos = normalPlaylist.filter(item => item.type === "video");
            const shuffled = [...videos];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const randomIndex = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[i]];
            }
            return shuffled;
        }

        function saveRandomPlaylist() {
            const filenames = randomVideoPlaylist.map(item => item.filename);
            localStorage.setItem(RANDOM_PLAYLIST_STORAGE_KEY, JSON.stringify(filenames));
        }

        function restoreRandomPlaylist() {
            try {
                const stored = localStorage.getItem(RANDOM_PLAYLIST_STORAGE_KEY);
                if (!stored) return false;

                const filenames = JSON.parse(stored);
                if (!Array.isArray(filenames) || filenames.length === 0) return false;

                const restored = [];
                filenames.forEach(filename => {
                    const item = normalPlaylist.find(m => m.filename === filename && m.type === "video");
                    if (item) restored.push(item);
                });

                const currentVideos = normalPlaylist.filter(item => item.type === "video");
                if (restored.length !== currentVideos.length) return false;

                randomVideoPlaylist = restored;
                return true;
            } catch (error) {
                console.error("Could not restore random playlist:", error);
                return false;
            }
        }

        function getSavedPlaybackSpeed() {

        let isSeekingWithoutControls = false;

        function forwardSeconds(sec = 10, revealControls = true) {
            if (playlist.length === 0) return;
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;
            if (!Number.isFinite(video.duration) || video.readyState < 1) return;

            if (!revealControls) {
                isSeekingWithoutControls = true;
            }

            const wasPlaying = !video.paused;
            const targetTime = Math.min(video.currentTime + sec, video.duration);
            try {
                if (typeof video.fastSeek === "function") {
                    video.fastSeek(targetTime);
                } else {
                    video.currentTime = targetTime;
                }
            } catch (e) {
                video.currentTime = targetTime;
            }

            if (wasPlaying && video.paused) {
                video.play().catch(() => {});
            }

            saveVideoPosition();
            updateProgressBarDisplay();
            if (revealControls) {
                showControls();
            }
            showSeekFeedback("right", sec);

            if (!revealControls) {
                setTimeout(() => {
                    isSeekingWithoutControls = false;
                }, 500);
            }
        }

        function backwardSeconds(sec = 5, revealControls = true) {
            if (playlist.length === 0) return;
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;
            if (!Number.isFinite(video.duration) || video.readyState < 1) return;

            if (!revealControls) {
                isSeekingWithoutControls = true;
            }

            const wasPlaying = !video.paused;
            const targetTime = Math.max(video.currentTime - sec, 0);
            try {
                if (typeof video.fastSeek === "function") {
                    video.fastSeek(targetTime);
                } else {
                    video.currentTime = targetTime;
                }
            } catch (e) {
                video.currentTime = targetTime;
            }

            if (wasPlaying && video.paused) {
                video.play().catch(() => {});
            }

            saveVideoPosition();
            updateProgressBarDisplay();
            if (revealControls) {
                showControls();
            }
            showSeekFeedback("left", sec);

            if (!revealControls) {
                setTimeout(() => {
                    isSeekingWithoutControls = false;
                }, 500);
            }
        }

        function getVideoPositions() {
            try {
                const stored = localStorage.getItem(VIDEO_POSITIONS_STORAGE_KEY);
                if (!stored) return {};
                const positions = JSON.parse(stored);
                return (typeof positions === "object" && positions !== null) ? positions : {};
            } catch (error) {
                return {};
            }
        }

        function saveVideoPosition() {
            if (playlist.length === 0) return;
            const currentItem = playlist[currentIndex];
            if (!currentItem || currentItem.type !== "video") return;
            if (!Number.isFinite(video.currentTime) || video.readyState < 1) return;

            const currentTime = video.currentTime;
            if (currentTime === lastSavedVideoTime) return;

            const positions = getVideoPositions();
            positions[currentItem.filename] = currentTime;
            localStorage.setItem(VIDEO_POSITIONS_STORAGE_KEY, JSON.stringify(positions));
            lastSavedVideoTime = currentTime;
        }

        function getSavedVideoPosition(filename) {
            const positions = getVideoPositions();
            const savedTime = positions[filename];
            return typeof savedTime === "number" ? savedTime : 0;
        }

        function removeVideoPosition(filename) {
            const positions = getVideoPositions();
            if (Object.prototype.hasOwnProperty.call(positions, filename)) {
                delete positions[filename];
                localStorage.setItem(VIDEO_POSITIONS_STORAGE_KEY, JSON.stringify(positions));
            }
        }
